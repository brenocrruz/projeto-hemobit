management.server.port=8081
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.info.env.enabled=true
info.app.name=Hemobit
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://tempo:4318/v1/traces
logging.file.name=/var/log/hemobit/hemobit.log
logging.pattern.correlation=[traceId=%X{traceId:-} spanId=%X{spanId:-}]\u0020
spring.jpa.show-sql=false
management.endpoints.access.default=read-only
