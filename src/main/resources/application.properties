spring.application.name=hemobit
spring.datasource.url=jdbc:postgresql://localhost:5432/hemobit
spring.datasource.username=postgres
spring.datasource.password=hemobit123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Roda o data.sql depois que o Hibernate cria/atualiza as tabelas (ver comentario no data.sql)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
