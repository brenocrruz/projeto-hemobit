spring.application.name=hemobit
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hemobit}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Evita dados pessoais em logs de corpos HTTP e parâmetros SQL, inclusive com DEBUG global.
spring.mvc.log-request-details=false
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF

# Simulador de telemetria (GPS + temperatura + timestamp) e coleta de métricas de rede.
# Em Docker Compose a URL aponta para o Nginx, para que a telemetria atravesse o proxy da topologia.
# Desligados por padrão (produção); o compose.yaml liga os dois no ambiente local.
hemobit.telemetria.simulador.habilitado=${TELEMETRIA_SIMULADOR_HABILITADO:false}
hemobit.rede.controle.habilitado=${REDE_CONTROLE_HABILITADO:false}
hemobit.telemetria.simulador.url=${TELEMETRIA_URL_INGESTAO:http://localhost:${server.port:8080}/api/v1/telemetria/leituras}
hemobit.telemetria.simulador.intervalo-ms=${TELEMETRIA_INTERVALO_MS:1000}
hemobit.telemetria.simulador.timeout-ms=2000
