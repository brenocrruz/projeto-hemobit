spring.application.name=hemobit

# ==========================================
# CONFIGURAÇÃO DO BANCO DE DADOS (H2 EM MEMÓRIA)
# ==========================================
spring.datasource.url=jdbc:h2:mem:hemobitdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Habilita o console web do H2 para visualizar o banco pelo navegador
# Acesso: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# CONFIGURAÇÕES DO JPA E INICIALIZAÇÃO (MANTIDAS)
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ==========================================
# CONFIGURAÇÕES DE LOG (MANTIDAS)
# ==========================================
# Evita dados pessoais em logs de corpos HTTP e parâmetros SQL, inclusive com DEBUG global.
spring.mvc.log-request-details=false
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF

# ==========================================
# TELEMETRIA E SIMULADOR (MANTIDAS)
# ==========================================
# Simulador de telemetria (GPS + temperatura + timestamp) e coleta de métricas de rede.
# Em Docker Compose a URL aponta para o Nginx, para que a telemetria atravesse o proxy da topologia.
# Desligados por padrão (produção); o compose.yaml liga os dois no ambiente local.
hemobit.telemetria.simulador.habilitado=${TELEMETRIA_SIMULADOR_HABILITADO:false}
hemobit.rede.controle.habilitado=${REDE_CONTROLE_HABILITADO:false}
hemobit.telemetria.simulador.url=${TELEMETRIA_URL_INGESTAO:http://localhost:${server.port:8080}/api/v1/telemetria/leituras}
hemobit.telemetria.simulador.intervalo-ms=${TELEMETRIA_INTERVALO_MS:1000}
hemobit.telemetria.simulador.timeout-ms=2000
# Métricas coletadas por Prometheus (pull).
management.otlp.metrics.export.enabled=false
management.endpoints.access.default=none
