# Controle de acesso do PostgreSQL (defesa em profundidade da sub-rede de banco 10.0.3.0/28).
# Mesmo que outra rede alcance o IP do banco (o Docker no macOS não isola redes por IP),
# só a API (10.0.3.11) e o socket local, usado pelo healthcheck, são aceitos.
# TYPE  DATABASE  USER  ADDRESS         METHOD
local   all       all                   trust
host    all       all   127.0.0.1/32    scram-sha-256
host    all       all   10.0.3.11/32    scram-sha-256
