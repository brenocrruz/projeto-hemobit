global:
  scrape_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: hemobit
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [app:8081]
  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_project]
        regex: hemobit-observabilidade
        action: keep
