# Proxy reverso da camada pública (topologia: sub-rede pública 10.0.1.0/24).
# Única porta exposta ao host; a API e o banco ficam apenas nas redes internas.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Log com tempos de rede: request_time (total no Nginx) e upstream_response_time (API).
    log_format telemetria '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                          'rt=$request_time urt=$upstream_response_time uct=$upstream_connect_time';
    access_log /var/log/nginx/access.log telemetria;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 1m;

    # Upgrade de conexão para o WebSocket /ws/telemetria.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream hemobit_api {
        server app:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://hemobit_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;  # mantém a porta: o WebSocket valida Origin x Host
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
        }

        location /ws/ {
            proxy_pass http://hemobit_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;  # mantém a porta: o WebSocket valida Origin x Host
            proxy_read_timeout 1h;
        }

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }
    }
}
